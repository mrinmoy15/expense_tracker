[project]
name = "expense-tracker"
version = "0.1.0"
description = "A Flask web app for tracking personal expenses"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
